version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Only data/ is mounted, so keep the personal files there; otherwise /setup and /profile are lost on rebuild
      USER_FILE: ${USER_FILE:-data/user.md}
      SOUL_FILE: ${SOUL_FILE:-data/soul.md}
      LOCALE_FILE: ${LOCALE_FILE:-data/locale.json}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
